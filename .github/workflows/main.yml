name: Build Diablo Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        shell: bash
        run: |
          set -e
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -f "$SDKMANAGER"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Install Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: '4.6.2'
          include-templates: true
          use-dotnet: false

      - name: Create debug keystore
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair \
              -keystore "$HOME/.android/debug.keystore" \
              -alias androiddebugkey \
              -storepass android \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Configure Godot
        shell: bash
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.6.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF

          python3 - <<'PY'
          from pathlib import Path
          p = Path("Source_Code/runtime/export_presets.cfg")
          s = p.read_text()
          s = s.replace(
              "package/signed=true",
              "package/signed=true"
          )
          if "keystore/debug" not in s:
              s += '''
          keystore/debug="$HOME/.android/debug.keystore"
          keystore/debug_user="androiddebugkey"
          keystore/debug_password="android"
          '''
          s = s.replace(
              'keystore/debug="$HOME/.android/debug.keystore"',
              'keystore/debug="' +
              str(Path.home() / ".android/debug.keystore") + '"'
          )
          p.write_text(s)
          PY

      - name: Import project
        run: |
          godot --headless \
            --path Source_Code/runtime \
            --editor --import --quit

      - name: Export Android APK
        run: |
          mkdir -p build
          godot --headless --path Source_Code/runtime --export-debug
          godot --headless --verbose \
            --path Source_Code/runtime \
            --export-debug Android \
            "$GITHUB_WORKSPACE/build/DiabloSurvivors.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DiabloSurvivors-Android
          path: build/DiabloSurvivors.apk
          if-no-files-found: error
